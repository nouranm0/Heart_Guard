    <!-- Add Patient Modal -->
    <div id="addPatientModal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeAddPatientModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="add_new_patient">Add New Patient</h3>
                <button class="modal-close" onclick="closeAddPatientModal()">&times;</button>
            </div>
            <form class="modal-form" onsubmit="handleAddPatient(event)">
                <div class="form-group">
                    <label for="patientName" data-i18n="patient_name">Patient Name</label>
                    <input type="text" id="patientName" name="name" required placeholder="Full name">
                </div>
                <div class="form-group">
                    <label for="patientPhone" data-i18n="phone">Phone</label>
                    <input type="tel" id="patientPhone" name="phone" placeholder="+20 1234567890">
                </div>
                <div class="form-group">
                    <label for="patientGender" data-i18n="gender">Gender</label>
                    <select id="patientGender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="patientBirthday" data-i18n="birthday">Birthday</label>
                    <input type="date" id="patientBirthday" name="birthday">
                </div>
                <div class="form-group">
                    <label for="patientDoctor" data-i18n="doctor">Assign to Doctor</label>
                    <select id="patientDoctor" name="doctor_id" required>
                        <option value="">Select Doctor</option>
                        {% for doctor in doctors if doctor.role == 'doctor' %}
                        <option value="{{ doctor.id }}">Dr. {{ doctor.username }} ({{ doctor.email }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-add" data-i18n="add">Add</button>
                    <button type="button" class="btn-cancel" onclick="closeAddPatientModal()" data-i18n="cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Patient Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeDeleteConfirm()"></div>
        <div class="modal-content modal-confirmation">
            <div class="confirmation-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <h2 class="confirmation-title" data-i18n="confirm_delete">Confirm Delete</h2>
            <p class="confirmation-message" id="deleteConfirmMessage">Are you sure?</p>
            <div class="confirmation-actions">
                <button class="btn-secondary" onclick="closeDeleteConfirm()" data-i18n="cancel">Cancel</button>
                <button class="btn-danger" onclick="confirmDeletePatient()" data-i18n="delete">Delete</button>
            </div>
        </div>
    </div>

    <script>
        function t(key, fallback) {
            if (window.languageManager && typeof window.languageManager.getText === 'function') {
                return window.languageManager.getText(key) || fallback;
            }
            return fallback;
        }

        // Global state for delete confirmation
        let pendingDelete = { patientId: null, patientName: null };

        function deletePatient(patientId, patientName) {
            pendingDelete.patientId = patientId;
            pendingDelete.patientName = patientName;
            
            const confirmMessage = document.getElementById('deleteConfirmMessage');
            if (confirmMessage) {
                confirmMessage.innerText = `هل تريد حذف المريض ${patientName}؟\n\nسيتم حذف جميع سجلات ECG والتنبيهات الخاصة به.\n\nهذا الإجراء لا يمكن التراجع عنه!`;
            }
            
            const modal = document.getElementById('deleteConfirmModal');
            if (modal) {
                modal.style.display = 'flex';
            } else {
                // Fallback to confirm if modal doesn't exist
                if (confirm(`حذف المريض "${patientName}"؟ سيتم حذف جميع السجلات!`)) {
                    confirmDeletePatient();
                }
            }
        }

        function confirmDeletePatient() {
            const patientId = pendingDelete.patientId;
            if (!patientId) return;

            const modal = document.getElementById('deleteConfirmModal');
            if (modal) modal.style.display = 'none';

            fetch(`/api/patient/${patientId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification(t('patient_deleted_success', 'Patient deleted successfully!'), 'success');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showNotification(t('error_prefix', 'Error: ') + (data.message || t('delete_failed', 'Delete failed')), 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification(t('unexpected_delete_error_prefix', 'An error occurred while deleting: ') + error.message, 'error');
            });
        }

        function closeDeleteConfirm() {
            const modal = document.getElementById('deleteConfirmModal');
            if (modal) modal.style.display = 'none';
            pendingDelete = { patientId: null, patientName: null };
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `flash-message flash-${type}`;
            notification.innerHTML = `
                ${message}
                <button class="flash-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            let container = document.getElementById('notificationContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'notificationContainer';
                container.className = 'notification-container';
                document.body.prepend(container);
            }

            container.appendChild(notification);
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.style.opacity = '0';
                    setTimeout(() => notification.remove(), 300);
                }
            }, 4000);
        }

        function getPatientsResultsRoot() {
            return document.querySelector('[data-patients-results]');
        }

        function getSearchForm() {
            return document.querySelector('.search-form[data-live-search="true"]');
        }

        function getSearchingLabel() {
            return t('searching', 'Searching...');
        }

        function setSearchBusy(isBusy) {
            const searchForm = getSearchForm();
            if (!searchForm) {
                return;
            }

            const submitButton = searchForm.querySelector('button[type="submit"]');
            const statusNode = searchForm.querySelector('[data-search-status]');

            if (submitButton) {
                submitButton.disabled = isBusy;
                submitButton.setAttribute('aria-busy', isBusy ? 'true' : 'false');
            }

            if (statusNode) {
                statusNode.textContent = isBusy ? getSearchingLabel() : '';
            }
        }

        function buildPatientsUrl(source) {
            const url = new URL(source, window.location.origin);
            url.searchParams.set('ajax', '1');
            return url;
        }

        function syncDeleteButtons() {
            // Delete actions are bound by delegation, so no per-node rebind is needed.
        }

        async function loadPatientsResults(source, replaceState = false) {
            const resultsRoot = getPatientsResultsRoot();
            if (!resultsRoot) {
                return;
            }

            const requestUrl = buildPatientsUrl(source);
            setSearchBusy(true);

            try {
                const response = await fetch(requestUrl.toString(), {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                });

                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const freshResultsRoot = doc.querySelector('[data-patients-results]');
                const fragmentHtml = freshResultsRoot ? freshResultsRoot.innerHTML : doc.body.innerHTML;

                resultsRoot.innerHTML = fragmentHtml;
                if (window.searchFormManager && typeof window.searchFormManager.attachForm === 'function') {
                    const refreshedSearchForm = getSearchForm();
                    if (refreshedSearchForm) {
                        window.searchFormManager.attachForm(refreshedSearchForm);
                    }
                }
                syncDeleteButtons();

                const stateUrl = new URL(source, window.location.origin);
                if (replaceState) {
                    window.history.replaceState({}, '', stateUrl.toString());
                } else {
                    window.history.pushState({}, '', stateUrl.toString());
                }
            } catch (error) {
                console.error('Failed to update patients list:', error);
            } finally {
                setSearchBusy(false);
            }
        }

        function bindPatientsAjax() {
            document.addEventListener('submit', (event) => {
                const form = event.target;
                if (!form.matches || !form.matches('.search-form[data-live-search="true"]')) {
                    return;
                }

                event.preventDefault();
                const formUrl = new URL(form.action || window.location.pathname, window.location.origin);
                const formData = new FormData(form);

                for (const [key, value] of formData.entries()) {
                    formUrl.searchParams.set(key, value);
                }

                loadPatientsResults(formUrl.toString());
            });

            document.addEventListener('click', (event) => {
                const patientsLink = event.target.closest('.filter-btn, .sort-btn');
                if (!patientsLink) {
                    const deleteButton = event.target.closest('.delete-patient-btn');
                    if (deleteButton) {
                        deletePatient(Number(deleteButton.dataset.patientId), deleteButton.dataset.patientName || '');
                    }
                    return;
                }

                const resultsRoot = getPatientsResultsRoot();
                if (!resultsRoot || !resultsRoot.contains(patientsLink)) {
                    return;
                }

                event.preventDefault();
                loadPatientsResults(patientsLink.href);
            });

            window.addEventListener('popstate', () => {
                loadPatientsResults(window.location.href, true);
            });
        }

        function openAddPatientModal() {
            document.getElementById('addPatientModal').style.display = 'flex';
        }

        function closeAddPatientModal() {
            document.getElementById('addPatientModal').style.display = 'none';
            document.querySelector('.modal-form').reset();
        }

        function handleAddPatient(event) {
            event.preventDefault();
            const formData = new FormData(document.querySelector('.modal-form'));
            const data = {
                name: formData.get('name'),
                phone: formData.get('phone') || null,
                gender: formData.get('gender'),
                birthday: formData.get('birthday') || null,
                doctor_id: parseInt(formData.get('doctor_id'))
            };

            fetch('/api/patient', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification(`${t('patient_added_success_prefix', 'Patient')} ${data.patient.name} ${t('added_success_suffix', 'added successfully!')}`, 'success');
                    closeAddPatientModal();
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showNotification(t('error_prefix', 'Error: ') + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification(t('unexpected_add_error_prefix', 'An error occurred while adding the patient: ') + error.message, 'error');
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            bindPatientsAjax();

            const addModal = document.getElementById('addPatientModal');
            addModal?.addEventListener('click', function(e) {
                if (e.target === addModal) {
                    closeAddPatientModal();
                }
            });

            const deleteModal = document.getElementById('deleteConfirmModal');
            deleteModal?.addEventListener('click', function(e) {
                if (e.target === deleteModal) {
                    closeDeleteConfirm();
                }
            });
        });
    </script>
</body>
</html>
